<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dealwatch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#262624">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Dealwatch</title>
<style>
/* Change the look here: all colors live in these variables */
:root{color-scheme:dark;--bg:#262624;--card:#30302E;--ink:#FAF9F5;--mute:#B0AEA5;--line:#46453F;--acc:#C96442;--accl:#E8896A;--accink:#FAF9F5;
--ok:#9CCBA5;--okbg:#2B3B30;--warn:#EBB864;--warnbg:#43361F;--urg:#FF8C80;--urgbg:#4D2926;--mutebg:#3B3A37;
--num:ui-serif,"New York","Iowan Old Style",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:12px 20px 4px}
h1{font:500 32px/1.1 var(--num);letter-spacing:-.02em;margin:0}
#view{flex:1;overflow-y:auto;padding:8px 16px 130px;-webkit-overflow-scrolling:touch}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--mute);font-size:11px;font-weight:600;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--accl)}nav button.on span{filter:none;opacity:1}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin:4px 0 10px;-webkit-appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;border:0;white-space:nowrap}
button.tag{flex:none;opacity:.55}button.tag.sel{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.banner{background:var(--urgbg);color:var(--urg);border-radius:12px;padding:10px 14px;font-weight:600;margin:2px 0 10px}
.sum{color:var(--mute);font-size:14px;margin:0 2px 10px}
.card{position:relative;display:flex;background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden;border:1px solid var(--line)}
.card::before{content:"";width:5px;flex:none;background:var(--c)}
.main{flex:1;min-width:0;padding:12px 14px}
.ttl{font-weight:600;font-size:17px;margin:6px 0 2px;overflow-wrap:anywhere}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:var(--num)}
.price b{font-size:24px;font-weight:600}.price s{color:var(--mute)}.price em{font-style:normal;font-weight:700;color:var(--ok);font-size:14px}
.meta{color:var(--mute);font-size:14px;margin-top:2px}
.note{font-size:14px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.use{margin-top:8px;border:1px solid var(--line);background:none;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.stub{position:relative;width:92px;flex:none;border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 6px;font-family:var(--num)}
.stub::before,.stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.stub::before{top:-8px}.stub::after{bottom:-8px}
.stub .n{font-size:36px;font-weight:500;line-height:1}.stub .l{font-size:12px;font-weight:600;margin-top:3px}
.stub.ok{background:var(--okbg);color:var(--ok)}.stub.warn{background:var(--warnbg);color:var(--warn)}.stub.urgent{background:var(--urgbg);color:var(--urg)}
.stub.soon,.stub.expired,.stub.used{background:var(--mutebg);color:var(--mute)}
.card.expired .main,.card.used .main{opacity:.6}
.empty{text-align:center;color:var(--mute);padding:50px 24px}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.calh{display:flex;align-items:center;gap:8px;margin:2px 0 8px}.calh h2{flex:1;margin:0;font:500 22px var(--num)}
.calh button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--card);border-radius:16px;padding:8px}
.dow{text-align:center;font-size:12px;color:var(--mute);font-weight:600;padding:2px 0 4px}
.day{border:0;background:none;border-radius:10px;height:52px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-weight:600}
.day.out{opacity:.35}.day.today .d{background:var(--ink);color:var(--bg)}.day.sel{box-shadow:inset 0 0 0 2px var(--accl)}
.d{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.dots{display:flex;gap:3px;margin-top:3px;height:8px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}.dots i.r{background:none;border:2px solid var(--c)}
.leg{color:var(--mute);font-size:13px;margin:8px 2px 12px}
h3{margin:14px 2px 8px;font:500 19px var(--num)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:0;width:100%;text-align:left;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.sw{width:30px;height:30px;border-radius:50%;flex:none}.row .nm{flex:1;font-weight:700}.row small{color:var(--mute)}
.btn-main{width:100%;border:0;background:var(--acc);color:var(--accink);font-weight:700;border-radius:14px;padding:13px;margin-bottom:12px}
.ov{position:fixed;inset:0;background:rgba(5,10,20,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font:500 24px var(--num)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 5px}
.sheet input,.sheet select,.sheet textarea{width:100%;min-width:0;min-height:46px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);-webkit-appearance:none;appearance:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mrow{display:flex;gap:8px}.mrow select{flex:1}
.seg{display:flex;background:var(--mutebg);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.btns{display:flex;gap:10px;margin-top:18px}.btns button,.ghost{border:0;border-radius:12px;padding:13px 16px;font-weight:700}
.primary{flex:1;background:var(--acc);color:var(--accink)}.danger{background:var(--urgbg);color:var(--urg)}.ghost{background:var(--mutebg)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
.swatches button{width:36px;height:36px;border-radius:50%;border:0}.swatches button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.swatches input[type=color]{width:44px;min-height:36px;height:36px;padding:2px;border-radius:50%}
.set{background:var(--card);border-radius:14px;padding:4px 14px 14px;margin-bottom:12px}.set p{color:var(--mute);font-size:14px;margin:4px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<header><h1 id="ttl"></h1></header>
<main id="view"></main>
</div>
<button id="fab" onclick="offerForm()" aria-label="Add offer">+</button>
<nav>
<button data-tab="list"><span>🏷️</span>Offers</button>
<button data-tab="cal"><span>📅</span>Calendar</button>
<button data-tab="mer"><span>🏪</span>Merchants</button>
<button data-tab="set"><span>⚙️</span>More</button>
</nav>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json" hidden>
<script>
const KEY='dealwatch.v1';
const COLORS=['#E5484D','#F76B15','#F5B301','#30A46C','#12A594','#0091FF','#3E63DD','#8E4EC6','#D6409F','#6B7280'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const diff=s=>Math.round((P(s)-today())/864e5);
const fd=s=>P(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const money=v=>'$'+(+v).toLocaleString('en-US',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});
function ink(h){const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(.299*r+.587*g+.114*b)>165?'#111':'#fff'}

let S=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.offers)&&Array.isArray(d.merchants))return{settings:{warn:7,urgent:3},...d}}catch(e){}return{merchants:[],offers:[],settings:{warn:7,urgent:3}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save. Storage may be full.')}}
let U={tab:'list',f:'active',m:null,q:'',cal:today(),sel:ds(today())};
const M=id=>S.merchants.find(m=>m.id===id);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}

function status(o){
  if(o.used)return{k:'used',n:'✓',l:'Used'};
  const dl=diff(o.end),st=o.type==='sale'&&o.start?diff(o.start):0;
  if(dl<0)return{k:'expired',n:'Ended',l:fd(o.end)};
  if(st>0)return{k:'soon',n:st,l:st==1?'day to start':'days to start'};
  const k=dl<=S.settings.urgent?'urgent':dl<=S.settings.warn?'warn':'ok';
  return dl==0?{k,n:'Today',l:'last day'}:{k,n:dl,l:dl==1?'day left':'days left'};
}
const isLive=o=>!['used','expired'].includes(status(o).k);
const tag=m=>m?`<span class="tag" style="background:${m.color};color:${ink(m.color)}">${esc(m.name)}</span>`:'<span class="tag" style="background:#9CA3AF;color:#111">No merchant</span>';

function card(o){
  const m=M(o.merchant),st=status(o),sale=o.type==='sale';
  const pct=sale&&o.orig>0&&o.price!=null?Math.round((1-o.price/o.orig)*100):0;
  const body=sale?`<div class="price">${o.price!=null?`<b>${money(o.price)}</b>`:''}${o.orig!=null?`<s>${money(o.orig)}</s>`:''}${pct>0?`<em>${pct}% off</em>`:''}</div>`:'';
  const when=sale?`${fd(o.start)} to ${fd(o.end)}`:`Deadline ${fd(o.end)}${o.card?`, ${esc(o.card)}`:''}`;
  return`<div class="card ${st.k}" style="--c:${m?m.color:'#9CA3AF'}" data-edit="${o.id}">
<div class="main">${tag(m)}<div class="ttl">${esc(o.title)}</div>${body}<div class="meta">${when}</div>${o.notes?`<div class="note">${esc(o.notes)}</div>`:''}
<button class="use" data-use="${o.id}">${o.used?'Undo used':'Mark used'}</button></div>
<div class="stub ${st.k}"><div class="n" ${String(st.n).length>3?'style="font-size:22px"':''}>${st.n}</div><div class="l">${st.l}</div></div></div>`;
}

function filtered(){
  const q=U.q.toLowerCase();
  const a=S.offers.filter(o=>{
    const live=isLive(o);
    if(U.f==='active'&&!live)return false;
    if(U.f==='sale'&&!(live&&o.type==='sale'))return false;
    if(U.f==='card'&&!(live&&o.type==='card'))return false;
    if(U.f==='hist'&&live)return false;
    if(U.m&&o.merchant!==U.m)return false;
    if(q){const m=M(o.merchant);if(!(`${o.title} ${o.notes} ${o.card} ${m?m.name:''}`.toLowerCase().includes(q)))return false}
    return true});
  return a.sort((x,y)=>U.f==='hist'?y.end.localeCompare(x.end):x.end.localeCompare(y.end));
}
function res(){
  const a=filtered();
  $('#res').innerHTML=a.length?a.map(card).join(''):S.offers.length?'<div class="empty"><b>Nothing here</b>Try another filter or search.</div>':'<div class="empty"><b>No offers yet</b>Add a merchant, then tap + to track your first sale or card offer.</div>';
}
function vList(){
  const live=S.offers.filter(isLive),hot=live.filter(o=>status(o).k==='urgent');
  const save$=live.filter(o=>o.type==='sale'&&o.orig!=null&&o.price!=null).reduce((s,o)=>s+Math.max(0,o.orig-o.price),0);
  const fs=[['active','Active'],['sale','Sales'],['card','Card offers'],['hist','Past'],['all','All']];
  $('#view').innerHTML=`${hot.length?`<div class="banner">${hot.length} ending within ${S.settings.urgent} days</div>`:''}
<input id="q" class="search" type="search" placeholder="Search offers" value="${esc(U.q)}">
<div class="chips">${fs.map(([k,l])=>`<button class="chip ${U.f===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
${S.merchants.length?`<div class="chips">${S.merchants.map(m=>`<button class="tag ${U.m===m.id?'sel':''}" data-m="${m.id}" style="background:${m.color};color:${ink(m.color)}">${esc(m.name)}</button>`).join('')}</div>`:''}
${live.length?`<p class="sum">${live.length} active${save$>0?`, ${money(save$)} in sale savings on the table`:''}</p>`:''}
<div id="res"></div>`;
  res();$('#q').oninput=e=>{U.q=e.target.value;res()};
}

function vCal(){
  const c=U.cal,y=c.getFullYear(),mo=c.getMonth(),first=new Date(y,mo,1);
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(y,mo,1-first.getDay()+i),k=ds(d);
    const live=S.offers.filter(o=>!o.used);
    const dots=[...live.filter(o=>o.end===k).map(o=>`<i style="--c:${(M(o.merchant)||{color:'#9CA3AF'}).color}"></i>`),
      ...live.filter(o=>o.type==='sale'&&o.start===k&&o.start!==o.end).map(o=>`<i class="r" style="--c:${(M(o.merchant)||{color:'#9CA3AF'}).color}"></i>`)].slice(0,4).join('');
    cells+=`<button class="day ${d.getMonth()!==mo?'out':''} ${k===ds(today())?'today':''} ${k===U.sel?'sel':''}" data-day="${k}"><span class="d">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  const on=S.offers.filter(o=>!o.used&&(o.type==='sale'&&o.start?o.start<=U.sel&&U.sel<=o.end:o.end===U.sel)).sort((a,b)=>a.end.localeCompare(b.end));
  $('#view').innerHTML=`<div class="calh"><h2>${c.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2>
<button data-cal="-1">‹</button><button data-cal="0">Today</button><button data-cal="1">›</button></div>
<div class="grid">${'SMTWTFS'.split('').map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>
<p class="leg">Filled dot: offer ends. Ring: sale starts.</p>
<h3>${P(U.sel).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h3>
${on.length?on.map(card).join(''):'<div class="empty">Nothing active on this day.</div>'}`;
}

function vMer(){
  $('#view').innerHTML=`<button class="btn-main" data-medit="">Add merchant</button>`+(S.merchants.length?S.merchants.map(m=>{
    const n=S.offers.filter(o=>o.merchant===m.id&&isLive(o)).length;
    return`<button class="row" data-medit="${m.id}"><span class="sw" style="background:${m.color}"></span><span class="nm">${esc(m.name)}</span><small>${n} active</small></button>`}).join(''):'<div class="empty"><b>No merchants yet</b>Merchants become color tags on every offer. Add stores and credit card issuers you shop with.</div>');
}

function vSet(){
  $('#view').innerHTML=`<div class="set"><label>Turn the countdown red at this many days or fewer</label><input id="s-u" type="number" min="0" value="${S.settings.urgent}" class="search">
<label>Turn the countdown amber at this many days or fewer</label><input id="s-w" type="number" min="0" value="${S.settings.warn}" class="search"></div>
<div class="set"><h3>Backup</h3><p>Your offers live only on this phone. Export a backup now and then, especially before clearing Safari data or switching phones.</p>
<div class="btns"><button class="ghost" id="exp">Export backup</button><button class="ghost" id="impb">Import backup</button></div></div>
<div class="set"><h3>Clean up</h3><div class="btns"><button class="ghost" id="clr">Delete past offers</button><button class="danger" id="wipe">Erase everything</button></div></div>`;
  $('#s-u').onchange=e=>{S.settings.urgent=Math.max(0,+e.target.value||0);S.settings.warn=Math.max(S.settings.urgent,S.settings.warn);save();render()};
  $('#s-w').onchange=e=>{S.settings.warn=Math.max(S.settings.urgent,+e.target.value||0);save();render()};
  $('#exp').onclick=exportData;$('#impb').onclick=()=>$('#imp').click();
  $('#clr').onclick=()=>{const n=S.offers.filter(o=>!isLive(o)).length;if(n&&confirm(`Delete ${n} expired or used offers?`)){S.offers=S.offers.filter(isLive);save();toast('Past offers deleted')}else if(!n)toast('No past offers')};
  $('#wipe').onclick=()=>{if(confirm('Erase all offers and merchants on this phone?')&&confirm('This cannot be undone. Erase everything?')){S={merchants:[],offers:[],settings:{warn:7,urgent:3}};save();render()}};
}
async function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),f=new File([blob],`dealwatch-backup-${ds(today())}.json`,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();
}
$('#imp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.offers)||!Array.isArray(d.merchants))throw 0;
    if(confirm(`Replace current data with ${d.offers.length} offers and ${d.merchants.length} merchants from this backup?`)){S={settings:{warn:7,urgent:3},...d};save();render();toast('Backup imported')}}catch(x){toast('That file is not a Dealwatch backup')}};
  r.readAsText(f);e.target.value='';
};

function render(){
  const v=$('#view'),y=v.scrollTop;
  ({list:vList,cal:vCal,mer:vMer,set:vSet})[U.tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===U.tab));
  $('#fab').style.display=U.tab==='list'||U.tab==='cal'?'':'none';
  $('#ttl').textContent={list:'Offers',cal:'Calendar',mer:'Merchants',set:'More'}[U.tab];
  v.scrollTop=y;
}

function sheet(html){
  const el=document.createElement('div');el.className='ov';el.innerHTML=`<div class="sheet">${html}</div>`;
  el.onclick=e=>{if(e.target===el)el.remove()};document.body.appendChild(el);return el;
}

function merchantForm(id,after){
  const m=id?M(id):{name:'',color:COLORS[S.merchants.length%COLORS.length]};let color=m.color;
  const el=sheet(`<h2>${id?'Edit':'New'} merchant</h2><label>Name</label><input id="m-n" value="${esc(m.name)}" placeholder="Target, Amex Offers, Chase" autocomplete="off">
<label>Tag color</label><div class="swatches">${COLORS.map(c=>`<button data-c="${c}" style="background:${c}"></button>`).join('')}<input type="color" id="m-c" value="${color}"></div>
<div style="margin-top:12px" id="m-p"></div>
<div class="btns">${id?'<button class="danger" id="m-del">Delete</button>':''}<button class="primary" id="m-save">Save</button></div>`);
  const paint=()=>{el.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c.toLowerCase()===color.toLowerCase()));$('#m-c').value=color;
    el.querySelector('#m-p').innerHTML=tag({name:el.querySelector('#m-n').value||'Preview',color})};
  paint();
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;paint()});
  el.querySelector('#m-c').oninput=e=>{color=e.target.value;paint()};
  el.querySelector('#m-n').oninput=paint;
  el.querySelector('#m-save').onclick=()=>{
    const name=el.querySelector('#m-n').value.trim();if(!name){toast('Enter a name');return}
    let r=m;if(id){m.name=name;m.color=color}else{r={id:uid(),name,color};S.merchants.push(r)}
    save();el.remove();render();after&&after(r.id);
  };
  const del=el.querySelector('#m-del');
  if(del)del.onclick=()=>{if(confirm(`Delete ${m.name}? Its offers will stay but lose their tag.`)){S.merchants=S.merchants.filter(x=>x.id!==id);S.offers.forEach(o=>{if(o.merchant===id)o.merchant=''});if(U.m===id)U.m=null;save();el.remove();render()}};
}

function offerForm(id){
  const o=id?S.offers.find(x=>x.id===id):{type:'sale',merchant:U.m||(S.merchants[0]||{}).id||'',title:'',orig:null,price:null,start:ds(today()),end:'',card:'',notes:''};
  let type=o.type;
  const opts=sel=>S.merchants.length?S.merchants.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join(''):'<option value="">Add a merchant first</option>';
  const el=sheet(`<h2>${id?'Edit':'New'} offer</h2>
<div class="seg"><button data-t="sale">Store sale</button><button data-t="card">Card offer</button></div>
<label>Merchant</label><div class="mrow"><select id="f-m">${opts(o.merchant)}</select><button class="ghost" id="f-nm">New</button></div>
<label id="f-tl"></label><input id="f-title" value="${esc(o.title)}" autocomplete="off">
<div id="sale-f"><div class="two"><div><label>Original price</label><input id="f-orig" type="number" inputmode="decimal" step="0.01" min="0" value="${o.orig??''}"></div>
<div><label>Sale price</label><input id="f-price" type="number" inputmode="decimal" step="0.01" min="0" value="${o.price??''}"></div></div>
<div class="two"><div><label>Starts</label><input id="f-start" type="date" value="${o.start||''}"></div><div><label>Ends</label><input id="f-end" type="date" value="${o.type==='sale'?o.end:''}"></div></div></div>
<div id="card-f"><label>Which card (optional)</label><input id="f-card" value="${esc(o.card)}" placeholder="Amex Gold, Sapphire" autocomplete="off">
<label>Deadline</label><input id="f-dead" type="date" value="${o.type==='card'?o.end:''}"></div>
<label>Notes</label><textarea id="f-notes" rows="2">${esc(o.notes)}</textarea>
<div class="btns">${id?'<button class="danger" id="f-del">Delete</button>':''}<button class="primary" id="f-save">Save</button></div>`);
  const g=s=>el.querySelector(s);
  const paint=()=>{
    el.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===type));
    g('#sale-f').style.display=type==='sale'?'':'none';g('#card-f').style.display=type==='card'?'':'none';
    g('#f-tl').textContent=type==='sale'?'What is on sale':'What is the offer';
    g('#f-title').placeholder=type==='sale'?'Spring clearance, running shoes':'5% back on dining, $10 off $50';
  };
  paint();
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;paint()});
  g('#f-nm').onclick=()=>merchantForm(null,nid=>{g('#f-m').innerHTML=opts(nid)});
  g('#f-save').onclick=()=>{
    const merchant=g('#f-m').value,title=g('#f-title').value.trim(),sale=type==='sale';
    if(!merchant){toast('Choose or add a merchant');return}
    if(!title){toast('Describe the offer');return}
    const end=sale?g('#f-end').value:g('#f-dead').value,start=sale?(g('#f-start').value||ds(today())):'';
    if(!end){toast(sale?'Pick an end date':'Pick a deadline');return}
    if(sale&&start>end){toast('End date is before the start');return}
    const num=v=>v===''?null:+v;
    const rec={...o,id:o.id||uid(),type,merchant,title,orig:sale?num(g('#f-orig').value):null,price:sale?num(g('#f-price').value):null,start,end,card:sale?'':g('#f-card').value.trim(),notes:g('#f-notes').value.trim(),used:!!o.used};
    if(id)S.offers[S.offers.findIndex(x=>x.id===id)]=rec;else S.offers.push(rec);
    save();el.remove();render();toast('Saved');
  };
  const del=g('#f-del');
  if(del)del.onclick=()=>{if(confirm('Delete this offer?')){S.offers=S.offers.filter(x=>x.id!==id);save();el.remove();render()}};
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-f],[data-m],[data-use],[data-edit],[data-day],[data-cal],[data-medit]');
  if(!t)return;const d=t.dataset;
  if(d.tab){U.tab=d.tab;render();$('#view').scrollTop=0}
  else if(d.f){U.f=d.f;render()}
  else if(d.m){U.m=U.m===d.m?null:d.m;render()}
  else if(d.use){const o=S.offers.find(x=>x.id===d.use);o.used=!o.used;save();render()}
  else if(d.edit)offerForm(d.edit);
  else if(d.day){U.sel=d.day;render()}
  else if(d.cal!==undefined){U.cal=d.cal==='0'?today():new Date(U.cal.getFullYear(),U.cal.getMonth()+Number(d.cal),1);if(d.cal==='0')U.sel=ds(today());render()}
  else if(d.medit!==undefined)merchantForm(d.medit||null);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
render();
</script>
</body>
</html>
